[package]
name = "carve-rb"
version = "0.1.14"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Native Ruby binding (magnus + rb-sys) for the Carve markup language, over the carve-rs engine."

[lib]
# Ruby loads the extension as a C shared object. cdylib produces that.
name = "carve"
crate-type = ["cdylib"]

[dependencies]
# High-level CRuby bindings. The `rb-sys` feature exposes the low-level rb-sys
# interop handles so this builds cleanly under rb_sys/mkmf for Ruby 3.2.
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = "0.9"
# The unreleased Carve 0.2 engine (carve-lang, library `carve`) is pinned to
# one Git commit; src/lib.rs names it `::carve` because this crate is also `carve`.
carve = { git = "https://github.com/markup-carve/carve-rs", rev = "41596a52cce66502956765bc7805d87de8756f78", package = "carve-lang" }

serde_json = "1"
