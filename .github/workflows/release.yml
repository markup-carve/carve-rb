name: Release

on:
  push:
    tags:
      - "v*"
  # A tag-triggered workflow is unexercisable between releases, which is how a
  # release job rots. This lets the whole gate run on demand against `main`; the
  # publish job below is tag-only, so a manual run builds and verifies the gem
  # and stops there.
  workflow_dispatch:

jobs:
  # Everything up to, but not including, making the artifact public. It ends by
  # uploading the exact .gem it verified, and the publish job pushes that file
  # rather than building its own -- so what RubyGems serves is the bytes this
  # job rendered the corpus through, not a second build of the same source.
  verify:
    name: Build the gem and run the corpus through it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard: the gem version AND the CHANGELOG must match the tag being
      # released, so a mistyped tag, a forgotten constant bump, or an un-cut
      # changelog cannot publish a gem that reports the wrong version. The
      # gemspec derives spec.version from Carve::VERSION, so this is the version
      # RubyGems would serve. carve-js published three releases whose exported
      # constant named 0.1.0 for want of this step (markup-carve/carve-js#1074).
      # test/release_version_test.rb checks the same constant against the same
      # two files on every push; this is the last chance to catch it.
      - name: Verify version and changelog match the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n 's/.*VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' lib/carve/version.rb | head -1)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Carve::VERSION $VER."
            exit 1
          fi
          # Compare the extracted heading literally rather than grepping the tag
          # as a pattern: a tag is not a regex, so `1.2.3` must not be satisfied
          # by a `## [1.2.3-rc1]` heading, and a tag carrying SemVer build
          # metadata must not be rejected for containing a `+`.
          if ! awk -v want="$TAG" '
                /^## / {
                  heading = $0
                  sub(/^## \[?/, "", heading)
                  sub(/\].*$/, "", heading)
                  sub(/ .*$/, "", heading)
                  if (heading == want) found = 1
                }
                END { exit !found }
              ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' section; cut it from [Unreleased] before releasing."
            exit 1
          fi

      # EVERY DECLARED DRIFT WINDOW MUST BE CLOSED. resources/spec-drift.txt is
      # where a divergence from spec main is written down so per-PR CI stops
      # refusing it (markup-carve/carve-rb#100, the split ruled in
      # markup-carve/carve#1811). A declared row is a window that is still open:
      # the gem renders that document by an older rule and somebody knows. It is
      # fine on a pull request, where the fix lives in a bump nobody is obliged
      # to make today, and it is not fine in a tag, which is public within
      # minutes and not reversible.
      #
      # This is the half of the split that keeps declaring from becoming a way
      # to ship drift. The corpus gate further down cannot catch it, because it
      # holds the gem to the spec the PINNED engine was written against, and a
      # declared window is by definition outside that.
      - name: Every declared drift window is closed
        run: |
          python3 scripts/check-spec-drift.py \
            --require-empty-ledger --ledger resources/spec-drift.txt --github

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Guard against panic = "abort"
        run: bash scripts/check-panic-unwind.sh


      # rb-sys runs bindgen while `gem install` compiles the packaged extension,
      # which is the only compile in this workflow. Nothing here builds the
      # source tree with `rake compile`: a gem is not its checkout, and a
      # separately compiled copy is not what gets published.
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1

      - name: Build gem
        run: gem build carve.gemspec

      # AGAINST THE SPEC COMMIT THE PINNED ENGINE PINS, not against spec main.
      # This is a deliberate NARROWING of what this gate refuses, and it is the
      # reason the gate exists at all rather than being switched off.
      #
      # It used to check out markup-carve/carve at its default branch, which
      # asks whether the gem is conformant with the spec as it stands right now.
      # No change in this repository can answer yes to that: the spec adds
      # documents continuously and an engine implements them some time later, so
      # between those two moments the gate cannot pass by construction, and a
      # gate that cannot pass gets skipped - the "check that cannot fail" of
      # markup-carve/carve#755 arriving from the opposite direction.
      #
      # It had already fired that way. The spec gained corpus category 367 on
      # 2026-08-18, and #77 - which does nothing but bump the engine pin and cut
      # the changelog, and is what moves Carve::VERSION off 0.1.0 so this
      # workflow can publish at all - went red on two documents that no engine
      # revision available that day rendered. The sibling binding carve-py went
      # further and half-shipped: v0.1.1 published its GitHub release and then
      # skipped the PyPI upload for the same two documents, leaving the registry
      # serving the release the security fix was for.
      #
      # So it now holds the gem to the spec the engine inside it was written
      # against: scripts/pinned-spec-commit.py reads the carve-rs revision
      # ext/carve/Cargo.toml pins, cross-checks it against what
      # ext/carve/Cargo.lock resolved, and takes that revision's tests/spec
      # gitlink. Every input is pinned in this repository, so the answer cannot
      # change while this repository does not, and a failure is cleared by
      # bumping the pin - an action taken here.
      #
      # WHAT IT STILL REFUSES, unchanged: a gem whose engine renders any of the
      # documents that engine claims to implement differently, a corpus that is
      # truncated or stale relative to what the spec's example pages declare, a
      # `require "carve"` that resolves anywhere but the isolated install, and a
      # package whose files differ from that install.
      #
      # WHAT MOVED TO NON-BLOCKING: how far this gem is from spec MAIN. That is
      # reported by the corpus-drift job in ci.yml, on every push, every pull
      # request and a daily schedule.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          # fetch-depth: 0 so the pinned revision can be read as a tree. A
          # shallow clone has the tip's tree and nothing else, and the pin is
          # deliberately not required to be the tip.
          fetch-depth: 0

      # PIN STALENESS FAILS HERE, and only here. In ci.yml the same script runs
      # without --max-age-days, printing the age and the distance as numbers,
      # because both are proxies that go red for upstream work a pull request
      # here did not cause - the reading markup-carve/carve-go#44 acted on when
      # it deleted its age gate rather than retuning it. A tag is the other
      # case: nobody is held hostage by it, it is the maintainer's own action,
      # and the consequence of shipping a stale engine is a published gem.
      #
      # Fourteen days is roughly five times this repository's observed bump
      # cadence of one to three days. The number is not load-bearing the way it
      # was when it was the ONLY detector: the drift ledger above already
      # refuses a known-diverging tag whatever the pin's age, and this catches
      # the case where the pin is simply old and nothing has diverged yet.
      - name: The pinned engine is real and not stale
        run: |
          python3 carve-rs/tools/check-engine-pin.py \
            --engine carve-rs --github --max-age-days 14 \
            --form cargo --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock

      - name: Resolve the spec commit the pinned engine pins
        id: pin
        run: |
          spec="$(python3 scripts/pinned-spec-commit.py \
            --engine carve-rs \
            --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Check out the spec corpus that engine was written against
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: ${{ steps.pin.outputs.spec }}
          path: spec

      # THE gate. It installs the .gem built above the way an embedder would,
      # asserts the `carve` it loaded resolved into that install and not into
      # this checkout, checks the package's files against the install byte for
      # byte, and renders the whole spec corpus through it -- population and
      # content both, the population derived by test/corpus_population.rb from
      # the spec's own example pages rather than written down here.
      #
      # It fails the job. It does not warn: laravel-carve, symfony-carve and
      # shopware-carve each carry a correct corpus comparison that runs on a
      # schedule and reports divergence while exiting 0, so every required check
      # is green while the shipped engine renders a sixth of the corpus
      # differently. And publishing is not reversible -- RubyGems indexes within
      # minutes and a yank is itself a public event -- so the only useful place
      # to find out is before the push, with a non-zero exit.
      - name: Run the spec corpus through the built gem
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: bash scripts/verify-release-artifact.sh "$(ls carve-lang-*.gem)"

      # The verified bytes, handed to the publish job. Uploading the artifact
      # rather than rebuilding is what makes "verified" and "published" the same
      # object.
      - name: Upload the verified gem
        uses: actions/upload-artifact@v4
        with:
          name: verified-gem
          path: carve-lang-*.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push the verified gem to RubyGems
    # `needs:` rather than step order. Ordering inside one job is not a gate: a
    # step that fails ends the job, but so does a step someone marks
    # continue-on-error, and neither arrangement makes the push structurally
    # unreachable. As a separate job that needs `verify`, the push cannot start
    # while the corpus gate is failing, and it has nothing to push except the
    # artifact that job uploaded.
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `id-token: write` is required for the OIDC exchange and is never
    # granted implicitly, not even when the repository default is read-write.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified gem
        uses: actions/download-artifact@v4
        with:
          name: verified-gem

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      # OIDC TRUSTED PUBLISHING. This replaced a hand-written
      # ~/.gem/credentials holding a long-lived API key, and the replacement is
      # not additive: a credentials FILE takes precedence over the environment
      # variables this action exports, so leaving it in place would silently
      # keep using the key and make the OIDC path look like it worked.
      #
      # GitHub mints a short-lived token naming this repository and workflow,
      # RubyGems exchanges it for a credential valid for minutes. The key can
      # then be deleted from the repository - which matters most here of the
      # three Ruby gems, because carve-lang is the native engine every Ruby
      # consumer compiles, so a hijacked push reaches the most people.
      #
      # Skipped on a dispatch: a rehearsal must not mint a publishing
      # credential.
      - name: Exchange the OIDC token for a RubyGems credential
        if: github.event_name != 'workflow_dispatch'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem to RubyGems
        run: gem push carve-lang-*.gem
