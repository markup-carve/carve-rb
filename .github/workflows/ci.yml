name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against panic = "abort" (preserves FFI catch_unwind safety)
        # magnus turns Rust panics into Ruby exceptions via catch_unwind, which
        # only works under panic = "unwind". This step fails the build if any
        # tracked Cargo.toml sets panic = "abort".
        run: bash scripts/check-panic-unwind.sh

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check (ext crate)
        run: cargo check --manifest-path ext/carve/Cargo.toml

      # `cargo check` only proves the extension COMPILES. The Ruby suite is the
      # only thing that exercises the gem's actual behavior through its public
      # API -- without it the engine can drift underneath us in silence, which
      # is exactly what happened: the carve-rs pin sat months behind and had
      # even fallen behind two breaking AST changes, while CI stayed green.
      - name: Install libclang (rb-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # The corpus is the only check that can tell a drifted pin from a current
      # one: everything above asserts hand-written expectations, which a drifted
      # engine satisfies happily.
      - name: Check out the spec corpus
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: spec

      - name: Compile the extension and run the test suite
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          bundle install
          bundle exec rake compile
          bundle exec rake test
