name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The corpus job below is the only check that can tell a drifted pin from a
  # current one, and it can start failing without a single commit here: the
  # SPEC moves, the pinned engine does not, and a push-triggered run reports
  # the state of the day someone last touched this repo. A scheduled run is
  # what turns that into a red build instead of silence.
  #
  # What the scheduled run does with the answer changed on 2026-10-02
  # (markup-carve/carve#2706). Drift the spec caused opens a pull request from
  # the declare-drift job; what still gates on the schedule is what this
  # repository can clear - a declaration its own measurement contradicts, a pin
  # naming a revision that was never merged, a run that measured nothing.
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

# Jobs carry an explicit timeout-minutes: without one GitHub applies a
# 360-minute default, long enough for a stalled job to go unnoticed.

jobs:
  # Which carve-rs is this gem running, and is that a revision that really
  # exists on `main`? The corpus job below answers whether a drifted pin
  # MATTERS; it is blind to any engine change no corpus document exercises
  # (markup-carve/carve-rs#449 is the concrete case, where openers past the
  # nesting cap were discarded and the rendered HTML was byte-identical either
  # way). This job answers whether the pin is real, and it keeps asserting that
  # with the pin sitting exactly on the engine's tip.
  #
  # NEITHER AGE NOR DISTANCE CAN FAIL IT. Both are proxies for "did the engine
  # change in a way that matters", and both go red for upstream work the author
  # of a pull request here did not cause: distance from the moment any PR opens
  # in carve-rs, age on a quiet fortnight where nothing diverged. Age's failure
  # was measured rather than argued - on 2026-08-23 this job passed with the pin
  # 44 commits behind and the gem rendering 50 corpus documents wrongly, because
  # the pin was 1.1 days old (markup-carve/carve-rb#100). markup-carve/carve-go#44
  # DELETED its age gate for the same reading rather than tightening the number.
  #
  # So both are printed as numbers and neither is asserted. What still gates
  # here is not a proxy: the pin is well formed, Cargo.lock resolved the same
  # revision Cargo.toml names, that revision exists, and it is an ancestor of
  # carve-rs main. A pin naming a revision that was never merged is wrong today
  # regardless of any threshold.
  #
  # Staleness DOES fail at the release gate, where a consequence already lives -
  # release.yml runs the same script with --max-age-days. A stale pin must not
  # reach a tag; it must not hold a pull request hostage.
  engine-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # fetch-depth: 0 is required. The guard runs `merge-base --is-ancestor`
      # against main, which needs the history to be there.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      - name: Report the pin's age and distance, and gate on it being real
        run: |
          # --max-age-days omitted: 0 is the script's report-only default.
          python3 carve-rs/tools/check-engine-pin.py \
            --engine carve-rs --github \
            --form cargo --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Guard against panic = "abort" (preserves FFI catch_unwind safety)
        # The extension converts a Rust panic into a rescuable
        # Carve::EnginePanic, which needs the panic to unwind first. That only
        # holds under panic = "unwind". This step fails the build if any tracked
        # Cargo.toml sets panic = "abort"; test/panic_unwind_test.rb covers the
        # conversion itself.
        run: bash scripts/check-panic-unwind.sh

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check (ext crate)
        run: cargo check --manifest-path ext/carve/Cargo.toml

      # `cargo check` only proves the extension COMPILES. The Ruby suite is the
      # only thing that exercises the gem's actual behavior through its public
      # API -- without it the engine can drift underneath us in silence, which
      # is exactly what happened: the carve-rs pin sat months behind and had
      # even fallen behind two breaking AST changes, while CI stayed green.
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        #
        # THE CHEAPEST APT CALL IS THE ONE NOT MADE. Three attempts against one
        # unhealthy mirror cost 12.6 minutes and then failed, taking `main` red
        # for an infrastructure reason that the verdict ticket it filed reads as
        # a gem defect (markup-carve/carve-rb#175). The runner image usually
        # already ships llvm, so look first and make no network request at all
        # on the common path.
        #
        # A LIBRARY IS NOT ENOUGH, so the probe does not stop at finding one.
        # bindgen needs clang's own resource headers too, and a split package
        # can ship libclang.so.1 with no lib/clang/<v>/include beside it -
        # bindgen then fails on every header it opens rather than at load time.
        # That is the same missing-resource-headers problem that makes a local
        # `rake compile` need BINDGEN_EXTRA_CLANG_ARGS pointed at the GCC
        # include directory. An install without them falls through to apt, so
        # this step either skips apt for a usable libclang or installs one; it
        # never hands bindgen a half-install and calls it a saving.
        run: |
          for lib in $(find /usr/lib -maxdepth 4 \
                         \( -name 'libclang.so' -o -name 'libclang.so.*' \) \
                         2>/dev/null | sort -V -r); do
            dir="$(dirname "$lib")"
            headers="$(find "$dir/clang" -maxdepth 3 -name stddef.h 2>/dev/null | sort -V | tail -1)"
            if [ -n "$headers" ]; then
              echo "libclang on the image: $lib (resource headers at $(dirname "$headers"))"
              echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::notice::$lib has no clang resource headers beside it"
          done
          echo "::notice::no usable libclang on the image; installing from apt"
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1

      # The corpus is the only check that can tell whether a drifted pin renders
      # documents wrongly TODAY: everything above asserts hand-written
      # expectations, which a drifted engine satisfies happily. Whether the pin
      # names a real, merged revision at all is the engine-pin job's question,
      # and the two are complementary rather than redundant.
      #
      # AGAINST THE SPEC COMMIT THE PINNED ENGINE PINS, not against spec main.
      # That difference is deliberate and it is a NARROWING, so it is worth
      # stating why.
      #
      # This used to check out markup-carve/carve at its default branch, which
      # asks: is this gem conformant with the spec as it stands right now?
      # carve-rb cannot answer yes to that by any change of its own. The spec
      # adds documents continuously - it gained corpus category 367 on
      # 2026-08-18 - and an engine implements them some time later. In between,
      # every pull request here is red for a reason that has nothing to do with
      # its diff, and the fix lives in another repository. A gate in that state
      # teaches every reader to skip it, and a gate nobody reads is a check that
      # cannot fail arriving by a different road (markup-carve/carve#755).
      #
      # It was not hypothetical here either: it left #77, which does nothing but
      # bump the pin and cut the changelog, red on two documents no engine
      # available that day rendered - and #77 is the change that lets
      # release.yml publish at all, since it is what moves Carve::VERSION off
      # 0.1.0. The sibling binding carve-py went further and half-shipped:
      # its v0.1.1 published a GitHub release and then skipped the PyPI upload
      # for the same two documents.
      #
      # The question this repository CAN answer, and the only one it can act on,
      # is whether the gem is as conformant as the engine it was built from.
      # scripts/pinned-spec-commit.py resolves that: the carve-rs revision
      # ext/carve/Cargo.toml pins, cross-checked against what
      # ext/carve/Cargo.lock resolved, and that revision's tests/spec gitlink.
      # Bumping the pin is the action that clears a failure here, and it is an
      # action taken in this repository.
      #
      # WHAT THIS DOES NOT BUY, said plainly: a gem that is simply OLD, with the
      # pin and the engine agreeing on a carve-rs from a month ago, passes here.
      # That is what corpus-drift below reports, and it is why deleting
      # corpus-drift would turn this into a loosening rather than a re-aiming.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          # fetch-depth: 0 so the pinned revision can be read as a tree. A
          # shallow clone has the tip's tree and nothing else, and the pin is
          # deliberately not required to be the tip.
          fetch-depth: 0

      - name: Resolve the spec commit the pinned engine pins
        id: pin
        run: |
          spec="$(python3 scripts/pinned-spec-commit.py \
            --engine carve-rs \
            --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Check out the spec corpus that engine was written against
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: ${{ steps.pin.outputs.spec }}
          path: spec

      - name: Compile the extension and run the test suite
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          bundle install
          bundle exec rake compile
          bundle exec rake test

      # Everything above tests the CHECKOUT: `rake compile` builds the extension
      # into lib/carve/ from the working tree and the suite drives that. What
      # gets published is a .gem, whose contents the gemspec's globs decide and
      # whose extension `gem install` compiles under its own toolchain. Those
      # are two artifacts, and release.yml used to push the second one having
      # only ever tested the first.
      #
      # The gate that closed that lives in release.yml, where it fires on a tag.
      # A check that only ever runs during a release is a check nobody has seen
      # work: it rots between releases, and the run that discovers it is broken
      # is the run where a version is waiting to go out. So it also runs here,
      # every push, over a gem built from this commit -- the same script, the
      # same corpus, the same refusal.
      - name: Build the gem and run the release gate over it
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          gem build carve.gemspec
          bash scripts/verify-release-artifact.sh "$(ls carve-lang-*.gem)"

      # For corpus-drift below. It measures the SAME gem this job gated rather
      # than building a second one: two builds would be two artifacts, and the
      # drift number would be about the one nothing else looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-gem
          path: carve-lang-*.gem
          if-no-files-found: error
          retention-days: 7

  # The same corpus comparison against spec MAIN. IT GATES, on the divergences
  # nobody has written down.
  #
  # It used to only report, and that is the defect markup-carve/carve-rb#100
  # measured: it discarded the gate's exit status and failed only when NO count
  # had been logged, so the one thing it could not do was fail on a count. On
  # 2026-08-23 it printed
  #
  #     50 of 1475 corpus documents render differently at spec main (2b213fc)
  #
  # and passed, in the run where `engine-pin` also passed on a 1.1-day-old pin
  # 44 commits behind. On a pull request the blocking detector (binding-parity)
  # did not run and the running detector could not block, so the drift landed
  # through a fully green PR.
  #
  # THE SPLIT IT NOW ENFORCES is markup-carve/carve#1811's ruling, applied here:
  #
  #   a DECLARED divergence passes.   The spec leads the engine by construction -
  #     a rule lands in markup-carve/carve, carve-rs implements it later, this gem
  #     picks it up later still - and resources/spec-drift.txt exists to describe
  #     that window. Declaring a row is the act that makes the window known, so a
  #     declared row has done its job and must not also be a failure. This is why
  #     it is not option 2 of the ticket: the threshold is not a count, it is
  #     whether anybody looked.
  #   an UNDECLARED divergence FAILS. That is the state nobody knows they are in,
  #     and it is the state #100 found: a pinned build rendering 50 documents
  #     wrongly with every required check green.
  #   pin age and distance report and do not fail, in engine-pin above.
  #
  # Both verdicts are cleared by an action taken in THIS repository - bump the
  # carve-rs revision in ext/carve/Cargo.toml, or write the row down with its
  # reason - which is the property age and distance lacked and the reason
  # markup-carve/carve-go#44 deleted them rather than retuning them.
  #
  # The release gate closes the other half: release.yml refuses a NON-EMPTY
  # ledger, so a declared window cannot reach a tag, and it is where pin
  # staleness fails.
  #
  # The schedule at the top of this file is still what makes this useful on a
  # quiet day: the spec moves without a commit here, so a push-triggered run
  # alone would report the state of the day someone last touched this repository.
  #
  # THE OLD GUARD IS KEPT, because it was real and is not superseded by gating on
  # the count: a run that logged NEITHER a divergence count nor a byte-identical
  # count measured nothing, and an empty diverging set then means "the comparison
  # never happened", not "nothing is wrong". scripts/check-spec-drift.py fails on
  # that, and on the same hole one layer in - a headline that counts divergence
  # while no per-document line was printed.
  #
  # WHAT IT GATES CHANGED ON 2026-10-02, markup-carve/carve#2706. The two
  # readings above were decided by one exit code, and only one of them is this
  # repository's to answer:
  #
  #   an UNDECLARED divergence is created by the SPEC MOVING. Nothing committed
  #     here causes it and no run here clears it by passing - row 537 landed
  #     upstream in markup-carve/carve#2695 hours before the 06:15 run that
  #     reddened `main` and blocked #158, a pull request about timeouts. The
  #     corpus gains documents faster than this pin moves, so the job returned
  #     to red by design, which is not a check anybody can clear. It now
  #     REPORTS, and the declare-drift job below turns it into a pull request
  #     carrying the diff.
  #   a STALE declaration is this repository contradicting ITSELF: the ledger
  #     claims a divergence the measurement does not produce. The clearing
  #     action is deleting the row, here, and it stays red until somebody does.
  #     So this half is still a gate, and it is now a FAILURE rather than the
  #     notice it used to be.
  #
  # The measurement itself is untouched, and so are the guards that make it a
  # measurement at all: a log with no headline, or a headline whose per-document
  # lines do not account for it, still fails. Those are not "upstream moved",
  # they are "nothing was measured", and reporting drift from a run that
  # measured nothing is the check that cannot fail (markup-carve/carve#755).
  #
  # The residual, stated rather than hidden: upstream CAN make a declared row
  # stale by changing the spec to agree with the pinned engine, and that would
  # redden `main` for an upstream cause. It is bounded in a way the undeclared
  # direction was not - it needs a spec change that happens to make this gem
  # correct again, where undeclared drift arrives with every corpus addition -
  # and the scheduled job below proposes the row deletions in the same pull
  # request, so the red arrives with its own fix attached.
  #
  # THE DISPLAY NAME IS DELIBERATELY UNCHANGED although what it gates narrowed.
  # `main`'s protection lists required status checks by CONTEXT, which for an
  # Actions job is this `name:` string, so renaming it retires the context that
  # every open pull request is waiting on and replaces it with one protection
  # has never heard of. The pull request does not go green, it waits forever on
  # a check that will not report again - and #158 is already blocked, so the
  # rename would have swapped one indefinite block for another. Renaming it
  # needs a protection update in the same step, which is a settings change and
  # not this pull request's to make.
  corpus-drift:
    name: The gem's drift from spec main is declared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    outputs:
      spec: ${{ steps.verdict.outputs.spec }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the spec corpus at main
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: spec

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `gem install` compiles the packaged extension, which runs rb-sys's
      # bindgen. Same reason the verify job installs it.
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. Bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit - it produces no
        # output, which makes it indistinguishable from a slow compile. On
        # 2026-08-19 this step hung nine times across the two repositories that
        # install libclang, for 28 to 113 minutes each, and every one was
        # cleared only by cancelling and re-running.
        #
        # Three tries, each capped at 4 minutes. A hung mirror now costs 12
        # minutes worst case and says so, instead of an hour of silence.
        #
        # THE CHEAPEST APT CALL IS THE ONE NOT MADE. Three attempts against one
        # unhealthy mirror cost 12.6 minutes and then failed, taking `main` red
        # for an infrastructure reason that the verdict ticket it filed reads as
        # a gem defect (markup-carve/carve-rb#175). The runner image usually
        # already ships llvm, so look first and make no network request at all
        # on the common path.
        #
        # A LIBRARY IS NOT ENOUGH, so the probe does not stop at finding one.
        # bindgen needs clang's own resource headers too, and a split package
        # can ship libclang.so.1 with no lib/clang/<v>/include beside it -
        # bindgen then fails on every header it opens rather than at load time.
        # That is the same missing-resource-headers problem that makes a local
        # `rake compile` need BINDGEN_EXTRA_CLANG_ARGS pointed at the GCC
        # include directory. An install without them falls through to apt, so
        # this step either skips apt for a usable libclang or installs one; it
        # never hands bindgen a half-install and calls it a saving.
        run: |
          for lib in $(find /usr/lib -maxdepth 4 \
                         \( -name 'libclang.so' -o -name 'libclang.so.*' \) \
                         2>/dev/null | sort -V -r); do
            dir="$(dirname "$lib")"
            headers="$(find "$dir/clang" -maxdepth 3 -name stddef.h 2>/dev/null | sort -V | tail -1)"
            if [ -n "$headers" ]; then
              echo "libclang on the image: $lib (resource headers at $(dirname "$headers"))"
              echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::notice::$lib has no clang resource headers beside it"
          done
          echo "::notice::no usable libclang on the image; installing from apt"
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1

      - name: Download the gem the corpus gate ran over
        uses: actions/download-artifact@v4
        with:
          name: ci-gem

      # MEASURE. The exit status is discarded HERE and only here: this run's job
      # is to produce the log, and divergence is what is being measured, so a
      # non-zero exit is the expected shape of a measurement that found some.
      # The verdict is a separate step that reads its own exit code, because
      # deciding from a grep is exactly the bug #100 was.
      - name: Measure the gem against spec main
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          set -uo pipefail
          bash scripts/verify-release-artifact.sh "$(ls carve-lang-*.gem)" > drift.log 2>&1 || true
          cat drift.log

      # DECIDE. Exits non-zero on an undeclared divergence, and on a log that
      # measured nothing. Nothing downstream reads its output to work out what
      # happened; the exit code is the verdict.
      - name: Every declaration is real, and undeclared drift is reported
        id: verdict
        run: |
          set -uo pipefail
          spec="$(git -C spec rev-parse --short HEAD)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          # errexit off around the pipeline only, so the summary below is
          # written on a refusal too - that is the run whose summary matters.
          # The status is then re-raised verbatim; it is never recomputed from
          # the text.
          set +e
          python3 scripts/check-spec-drift.py \
            --log drift.log --ledger resources/spec-drift.txt \
            --spec "$spec" --github \
            --on-undeclared notice --on-stale error \
            --write-undeclared undeclared.txt 2>&1 | tee drift-verdict.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## The published gem against spec main ($spec)"
            echo
            echo '```'
            cat drift-verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # For declare-drift below, which runs on the schedule only. Uploaded even
      # on a refusal: a stale row fails the step above, and the undeclared rows
      # measured in the same run are still worth a pull request. `if: always()`
      # rather than a success condition, because tying the artifact to the gate
      # would let the gate's failure silence the channel this ruling created.
      #
      # if-no-files-found: error. The file is written on every run whose
      # comparison happened and is EMPTY when nothing is undeclared, so its
      # absence means the measurement did not get that far - and an automation
      # that reads a missing file as "all clear" is reporting about a run that
      # did not happen.
      - name: Keep the undeclared rows
        if: always() && hashFiles('undeclared.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: undeclared-drift
          path: undeclared.txt
          if-no-files-found: error
          retention-days: 7

  # THE CHANNEL markup-carve/carve#2706 RULED. Undeclared drift arrives as a
  # pull request rather than as a red default branch.
  #
  # SCHEDULE AND MANUAL DISPATCH ONLY, and that is the point rather than a
  # saving. A contributor's pull request is not the place to learn that the spec
  # moved, and a bot opening a pull request per topic branch is how a filer gets
  # muted and takes the real ones with it.
  #
  # WHY IT IS A JOB HERE AND NOT ITS OWN WORKFLOW FILE, since a separate file
  # reads tidier: the drift number has to be about the gem something else looked
  # at. corpus-drift deliberately downloads the artifact `build` produced
  # instead of compiling a second one, because two builds are two artifacts and
  # the drift would describe the one no other job gated. A standalone workflow
  # cannot reach that artifact without rebuilding, so it would measure a gem
  # nothing else has seen. The copyable unit for the other repositories is
  # scripts/declare-spec-drift.sh plus this job, not the file boundary.
  declare-drift:
    name: Undeclared drift opens a pull request
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: corpus-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time per ref, none cancelled. The script's read-compare-push over
    # one branch is not atomic, and a cancelled run is a run that reported
    # nothing.
    concurrency:
      group: declare-spec-drift-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The script merges `main` into the branch on the preserve path, so it
          # needs more than the tip.
          fetch-depth: 0

      # continue-on-error, because the artifact is absent exactly when
      # corpus-drift's comparison never happened - and the script's own refusal
      # for a missing file says that in words, where a failed download says
      # "Artifact not found". Both fail the job; only one of them tells the
      # reader which of the two states they are in.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: undeclared-drift

      # BUMP_TOKEN when the repository has it, GITHUB_TOKEN otherwise. Not
      # interchangeable, and the difference is worth knowing before reading the
      # pull request: a GITHUB_TOKEN-authored pull request does not trigger this
      # repository's own workflows, so it arrives with no checks, and creating
      # it at all needs "Allow GitHub Actions to create and approve pull
      # requests" enabled. With a fine-grained token the pull request is a
      # normal one that CI validates.
      - name: Open or update the declaration pull request
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/declare-spec-drift.sh \
            --undeclared undeclared.txt \
            --spec "${{ needs.corpus-drift.outputs.spec }}"

  # The run knows before anyone does. Everything above already refuses correctly
  # and says why - on 2026-08-29 the 06:15 scheduled run named a stale pin and
  # the file to edit, and the person who acted on it read about it four hours
  # later in markup-carve/carve#1877, filed by a DIFFERENT repository. Nothing
  # here carried the verdict off the Actions tab (#107).
  #
  # So this job is not another check. It adds no coverage and can find nothing:
  # it reports what the jobs above decided, into a ticket that a red run files,
  # a later red run edits, and the first green run closes.
  #
  # It runs on the default branch only. A red topic branch belongs to whoever
  # pushed it and they are already looking; filing there would open a ticket per
  # broken push, which is how a filer gets muted and takes the real ones with it.
  verdict:
    name: The verdict reaches a person
    # always(), because it is skipped by default exactly when a job ahead of it
    # fails - the only run it has anything to say about.
    if: always()
    # declare-drift is in here although opening a pull request is not a CI
    # failure to report: the invariant test/ci_verdict_test.rb pins is that the
    # filer waits for EVERY job, so that it cannot read the run before they
    # finish. declare-drift can also genuinely fail - a refused lease, a
    # conflicting merge - and that is a verdict worth carrying. It is skipped on
    # every push and pull request, which `always()` above already tolerates.
    needs: [engine-pin, build, corpus-drift, declare-drift]
    # Runs on this branch overlap - a push and the 06:15 schedule - and the
    # filer's read-check-write over the ticket is not atomic. Two of them
    # interleaved can file the ticket twice, or close one the other just wrote.
    # This queues them instead: one verdict at a time per ref, none cancelled,
    # because a cancelled verdict is a run that reported nothing. The run-id
    # stamp in the ticket body still stands behind it - queue order is not the
    # same promise as chronological order.
    concurrency:
      group: ci-verdict-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # A job-level block REPLACES the default set rather than adding to it, so
      # every scope omitted here is `none`, and each of these three is load
      # bearing: without `contents` the job dies at checkout, without `actions`
      # it dies on the first API call reading this run's jobs, and without
      # `issues` it dies on the write. Any of the three files nothing at all,
      # which is the silence this job exists to end.
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: File the verdict where someone reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Must equal this job's `name:` above. The script excludes itself by
          # this string, and test/ci_verdict_test.rb asserts the two agree.
          VERDICT_JOB_NAME: The verdict reaches a person
        run: bash scripts/file-ci-verdict.sh
