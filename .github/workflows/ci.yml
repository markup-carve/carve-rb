name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The corpus job below is the only check that can tell a drifted pin from a
  # current one, and it can start failing without a single commit here: the
  # SPEC moves, the pinned engine does not, and a push-triggered run reports
  # the state of the day someone last touched this repo. A scheduled run is
  # what turns that into a red build instead of silence.
  #
  # This one GATES rather than reports. A corpus divergence is not upstream
  # being ahead, it is this artifact rendering documents wrongly today.
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  # Which carve-rs is this gem running, and is that a revision that really
  # exists on `main`? The corpus job below answers whether a drifted pin
  # MATTERS; it is blind to any engine change no corpus document exercises
  # (markup-carve/carve-rs#449 is the concrete case, where openers past the
  # nesting cap were discarded and the rendered HTML was byte-identical either
  # way). This job answers whether the pin is real, and it keeps asserting that
  # with the pin sitting exactly on the engine's tip.
  #
  # It is deliberately NOT a distance check. carve-rs merges continuously, so
  # "fail when behind main" would be red from the moment any PR opens there and
  # unclearable by the action it recommends. The lag is printed as a number;
  # only AGE can fail this job.
  engine-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fetch-depth: 0 is required. The guard runs `merge-base --is-ancestor`
      # against main, which needs the history to be there.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          fetch-depth: 0

      # --max-age-days 14: this repository has bumped the pin every one to three
      # days since it started tracking it (the widest gap on record is three),
      # so fourteen is roughly five times the observed cadence -- wide enough
      # that a quiet fortnight is not a false alarm, tight enough to catch the
      # failure that actually happened here, where the pin sat months behind
      # while CI stayed green. Age rather than commit count, because age is what
      # bumping the pin clears.
      - name: Check the pinned engine revision
        run: |
          python3 carve-rs/tools/check-engine-pin.py \
            --engine carve-rs --github --max-age-days 14 \
            --form cargo --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against panic = "abort" (preserves FFI catch_unwind safety)
        # magnus turns Rust panics into Ruby exceptions via catch_unwind, which
        # only works under panic = "unwind". This step fails the build if any
        # tracked Cargo.toml sets panic = "abort".
        run: bash scripts/check-panic-unwind.sh

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check (ext crate)
        run: cargo check --manifest-path ext/carve/Cargo.toml

      # `cargo check` only proves the extension COMPILES. The Ruby suite is the
      # only thing that exercises the gem's actual behavior through its public
      # API -- without it the engine can drift underneath us in silence, which
      # is exactly what happened: the carve-rs pin sat months behind and had
      # even fallen behind two breaking AST changes, while CI stayed green.
      - name: Install libclang (rb-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      # The corpus is the only check that can tell whether a drifted pin renders
      # documents wrongly TODAY: everything above asserts hand-written
      # expectations, which a drifted engine satisfies happily. Whether the pin
      # names a real, merged revision at all is the engine-pin job's question,
      # and the two are complementary rather than redundant.
      #
      # AGAINST THE SPEC COMMIT THE PINNED ENGINE PINS, not against spec main.
      # That difference is deliberate and it is a NARROWING, so it is worth
      # stating why.
      #
      # This used to check out markup-carve/carve at its default branch, which
      # asks: is this gem conformant with the spec as it stands right now?
      # carve-rb cannot answer yes to that by any change of its own. The spec
      # adds documents continuously - it gained corpus category 367 on
      # 2026-08-18 - and an engine implements them some time later. In between,
      # every pull request here is red for a reason that has nothing to do with
      # its diff, and the fix lives in another repository. A gate in that state
      # teaches every reader to skip it, and a gate nobody reads is a check that
      # cannot fail arriving by a different road (markup-carve/carve#755).
      #
      # It was not hypothetical here either: it left #77, which does nothing but
      # bump the pin and cut the changelog, red on two documents no engine
      # available that day rendered - and #77 is the change that lets
      # release.yml publish at all, since it is what moves Carve::VERSION off
      # 0.1.0. The sibling binding carve-py went further and half-shipped:
      # its v0.1.1 published a GitHub release and then skipped the PyPI upload
      # for the same two documents.
      #
      # The question this repository CAN answer, and the only one it can act on,
      # is whether the gem is as conformant as the engine it was built from.
      # scripts/pinned-spec-commit.py resolves that: the carve-rs revision
      # ext/carve/Cargo.toml pins, cross-checked against what
      # ext/carve/Cargo.lock resolved, and that revision's tests/spec gitlink.
      # Bumping the pin is the action that clears a failure here, and it is an
      # action taken in this repository.
      #
      # WHAT THIS DOES NOT BUY, said plainly: a gem that is simply OLD, with the
      # pin and the engine agreeing on a carve-rs from a month ago, passes here.
      # That is what corpus-drift below reports, and it is why deleting
      # corpus-drift would turn this into a loosening rather than a re-aiming.
      - name: Check out carve-rs
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve-rs
          path: carve-rs
          # fetch-depth: 0 so the pinned revision can be read as a tree. A
          # shallow clone has the tip's tree and nothing else, and the pin is
          # deliberately not required to be the tip.
          fetch-depth: 0

      - name: Resolve the spec commit the pinned engine pins
        id: pin
        run: |
          spec="$(python3 scripts/pinned-spec-commit.py \
            --engine carve-rs \
            --manifest ext/carve/Cargo.toml --lock ext/carve/Cargo.lock)"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"

      - name: Check out the spec corpus that engine was written against
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          ref: ${{ steps.pin.outputs.spec }}
          path: spec

      - name: Compile the extension and run the test suite
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          bundle install
          bundle exec rake compile
          bundle exec rake test

      # Everything above tests the CHECKOUT: `rake compile` builds the extension
      # into lib/carve/ from the working tree and the suite drives that. What
      # gets published is a .gem, whose contents the gemspec's globs decide and
      # whose extension `gem install` compiles under its own toolchain. Those
      # are two artifacts, and release.yml used to push the second one having
      # only ever tested the first.
      #
      # The gate that closed that lives in release.yml, where it fires on a tag.
      # A check that only ever runs during a release is a check nobody has seen
      # work: it rots between releases, and the run that discovers it is broken
      # is the run where a version is waiting to go out. So it also runs here,
      # every push, over a gem built from this commit -- the same script, the
      # same corpus, the same refusal.
      - name: Build the gem and run the release gate over it
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          gem build carve.gemspec
          bash scripts/verify-release-artifact.sh "$(ls carve-lang-*.gem)"

      # For corpus-drift below. It measures the SAME gem this job gated rather
      # than building a second one: two builds would be two artifacts, and the
      # drift number would be about the one nothing else looked at.
      - uses: actions/upload-artifact@v4
        with:
          name: ci-gem
          path: carve-lang-*.gem
          if-no-files-found: error
          retention-days: 7

  # The same corpus comparison against spec MAIN, REPORTED and not gated.
  #
  # This is the other half of re-aiming the corpus gate above, and it is not
  # optional. The question that gate no longer asks - how far is this gem from
  # the spec as it stands today - is still worth knowing; it is simply not
  # something a pull request here can fix, so it must not block one. Deleting
  # this job would leave the drift invisible and turn the re-aiming into a
  # loosening. carve-go carries the identical pair for the identical reason.
  #
  # The schedule at the top of this file is what makes it useful: the spec moves
  # without a commit here, so a push-triggered run alone would report the state
  # of the day someone last touched this repository.
  #
  # IT IS NOT A CHECK THAT CANNOT FAIL. It never fails ON the number, but it
  # fails when it did not MEASURE one: a corpus that moved, a spec layout this
  # no longer finds, a gem that will not install. Those are the ways a reporting
  # job silently becomes decoration, and the guard against them is requiring
  # evidence of a measurement rather than an exit status - the run has to have
  # logged either a divergence count or a byte-identical count.
  corpus-drift:
    name: Report the drift against spec main
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check out the spec corpus at main
        uses: actions/checkout@v4
        with:
          repository: markup-carve/carve
          path: spec

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `gem install` compiles the packaged extension, which runs rb-sys's
      # bindgen. Same reason the verify job installs it.
      - name: Install libclang (rb-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Download the gem the corpus gate ran over
        uses: actions/download-artifact@v4
        with:
          name: ci-gem

      - name: Report the drift
        env:
          CARVE_SPEC_CORPUS: ${{ github.workspace }}/spec/tests/corpus
        run: |
          set -uo pipefail
          # The gate exits non-zero on divergence. Here divergence is the thing
          # being reported, so the exit status is discarded and the LOG is what
          # is read; a run that logged no count at all still fails below.
          bash scripts/verify-release-artifact.sh "$(ls carve-lang-*.gem)" > drift.log 2>&1 || true
          cat drift.log
          spec="$(git -C spec rev-parse --short HEAD)"
          diverging="$(grep -oE '[0-9]+ of [0-9]+ corpus documents render differently' drift.log | tail -1 || true)"
          identical="$(grep -oE '[0-9]+ of [0-9]+ declared corpus documents byte-identical' drift.log | tail -1 || true)"
          if [ -n "$diverging" ]; then
            headline="$diverging at spec main ($spec)"
          elif [ -n "$identical" ]; then
            headline="0 diverging, $identical at spec main ($spec)"
          else
            echo "::error::the drift run logged neither a divergence count nor a byte-identical count, so nothing was measured" >&2
            tail -40 drift.log >&2
            exit 1
          fi
          echo "$headline"
          echo "::notice::$headline"
          {
            echo "## The published gem against spec main"
            echo
            echo "$headline"
          } >> "$GITHUB_STEP_SUMMARY"
